name: Build & Release Wheel

on:
  workflow_dispatch:

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install build dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            gcc g++ pkg-config libssl-dev clang
          pip install "setuptools>=82" "poetry-core==2.3.1" \
            "numpy>=1.26.4" "cython==3.2.4" packaging wheel

      - name: Build wheel
        run: pip wheel --no-deps --wheel-dir /tmp/wheels .

      - name: Inspect wheel
        id: wheel_info
        run: |
          WHL=$(ls /tmp/wheels/nautilus_trader-*.whl)
          WHL_NAME=$(basename "$WHL")
          VERSION=$(echo "$WHL_NAME" | sed -E 's/nautilus_trader-([^-]+)-.*/\1/')
          echo "whl_path=$WHL" >> "$GITHUB_OUTPUT"
          echo "whl_name=$WHL_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Built: $WHL_NAME (v$VERSION)"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="wheel-v${{ steps.wheel_info.outputs.version }}"

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists, uploading wheel as update"
            gh release upload "$TAG" "${{ steps.wheel_info.outputs.whl_path }}" --clobber
          else
            gh release create "$TAG" \
              --title "nautilus_trader ${{ steps.wheel_info.outputs.version }} (linux x86_64)" \
              --notes "Pre-built wheel for linux x86_64, Python 3.12.
          Commit: ${{ github.sha }}" \
              "${{ steps.wheel_info.outputs.whl_path }}"
          fi
          echo "Release: $TAG"
